<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vibe Coding Playground — интерактивная витрина современной веб-разработки: анимации, интерактив, визуальные эффекты и responsive."
    />
    <meta name="theme-color" content="#07070d" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Vibe Coding Playground" />
    <meta
      property="og:description"
      content="Интерактивная витрина: анимации, интерактив, visual effects и адаптивность. Создано с Claude и Cursor."
    />
    <meta property="og:url" content="https://opsurgut.ru/" />
    <meta property="og:image" content="https://opsurgut.ru/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vibe Coding Playground" />
    <meta
      name="twitter:description"
      content="Интерактивная витрина современной веб-разработки."
    />
    <title>Vibe Coding Playground</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
